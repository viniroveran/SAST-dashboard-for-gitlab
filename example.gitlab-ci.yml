# .gitlab-ci.yml

stages:
  - test
  - deploy
  - report

# Include the GitLab SAST template
include:
  - template: Security/SAST.gitlab-ci.yml

# Example test job (can be any other job)
test_job:
  stage: test
  script:
    - echo "Running tests..."
    - sleep 5 # Simulates some work
  artifacts:
    paths:
      - gl-sast-report.json # Ensure the SAST report is an artifact

# SAST Job (generated by the template, but here for reference)
sast:
  stage: test # Or the stage you configured for security
  artifacts:
    reports:
      sast: gl-sast-report.json # The generated SAST report
    paths:
      - gl-sast-report.json # Ensure the file is available for subsequent jobs
    expire_in: 1 week

# NEW JOB: Send SAST Report to Dashboard
send_sast_report:
  stage: report # A new stage or an existing one after SAST
  image: alpine:latest # Needs jq + curl (see before_script below)
  before_script:
    - apk add --no-cache jq curl
  needs:
    - sast # This job depends on the SAST job
  script: |
    echo "Sending SAST report to dashboard..."
    # Check if the SAST report file exists
    if [ ! -f "gl-sast-report.json" ]; then echo "SAST report file not found!"; exit 1; fi

    # Construct the JSON payload into a file, not a shell variable — on a large
    # report, passing it through argv (via `--argjson "$(cat ...)"` into jq, or
    # via `-d "$PAYLOAD"` into curl) can exceed the OS's exec argument-size
    # limit ("Argument list too long" / E2BIG). jq reads the report with
    # --slurpfile and curl sends the payload with -d @file, so the report
    # content never touches argv on either end.
    # The dashboard's /api/sast-webhook expects sastReport to already be the
    # consolidated { vulnerabilities: [...] } shape, not the raw report file
    # (which also carries `version`/`scan` fields the endpoint ignores).
    jq -n \
      --arg repo "$CI_PROJECT_NAME" \
      --slurpfile report gl-sast-report.json \
      '{repoName: $repo, sastReport: {vulnerabilities: $report[0].vulnerabilities}}' \
      > /tmp/sast_payload.json

    # Send the payload to the Next.js endpoint
    curl -X POST \
      -H "Content-Type: application/json" \
      -H "X-Gitlab-Token: $GITLAB_WEBHOOK_SECRET" \
      -d @/tmp/sast_payload.json \
      "$SAST_DASHBOARD_WEBHOOK_URL"
    echo "SAST report sent successfully."
  # Define environment variables for this job (optional, but useful for debugging)
  variables:
    SAST_DASHBOARD_WEBHOOK_URL: "https://your-nextjs-app.com/api/sast-webhook" # Replace with the actual URL
    # GITLAB_WEBHOOK_SECRET: "your_secret_token_here" # Defined as a CI/CD variable
  # Ensure the job only runs if the SAST job is successful
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' # Only for the default branch, for example
      when: on_success